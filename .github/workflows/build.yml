name: Bygg Fotobacken

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}

    steps:
      - name: Hämta repot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hitta senast uppladdade zip
        id: zip
        run: |
          ZIP=$(git log -1 --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then ZIP="Fotobacken.zip"; fi
          if [ ! -f "$ZIP" ]; then echo "::error::Hittar ingen zip-fil i repot"; exit 1; fi
          echo "Använder: $ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Packa upp
        id: src
        run: |
          rm -rf src && mkdir src
          unzip -q "${{ steps.zip.outputs.file }}" -d src
          ROOT=$(find src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then echo "::error::Ingen settings.gradle(.kts) i zip-filen"; exit 1; fi
          echo "Projektrot: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          if [ ! -f "$ROOT/app/fotobacken.keystore" ]; then
            echo "::warning::app/fotobacken.keystore saknas – APK:n får inte den fasta signaturen"
          fi
          if [ -z "$DROPBOX_APP_KEY" ] && ! grep -q '^DROPBOX_APP_KEY=.\+' "$ROOT/gradle.properties"; then
            echo "::warning::Ingen Dropbox-nyckel – Dropbox-fliken blir avstängd i den här APK:n"
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bygg (assembleRelease)
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/bygglogg.txt"

      - name: Spara bygglogg vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bygglogg
          path: bygglogg.txt

      - name: Döp om APK
        run: |
          APK=$(find "${{ steps.src.outputs.root }}" -path '*build/outputs/apk/release/*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::Ingen APK hittades"; exit 1; fi
          cp "$APK" Fotobacken.apk

      - name: Publicera under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fotobacken bygge ${{ github.run_number }}
          files: Fotobacken.apk
          make_latest: true
